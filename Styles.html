<style>
  :root {
    --blue: #12305b; --blue-2: #1d4580; --accent: #c8402a;
    --ink: #1f2328; --muted: #57606a; --line: #d0d5dd; --soft: #f4f5f7;
    --ok: #146c43; --ok-bg: #e6f4ec; --bad: #a4261d; --bad-bg: #fbeae8; --warn: #7a4f00; --warn-bg: #fdf3d8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px;
    line-height: 1.5; color: var(--ink); background: #fff; }
  h1, h2, h3 { color: var(--blue); margin: 0 0 8px; line-height: 1.25; }
  h1 { font-size: 26px; } h2 { font-size: 20px; } h3 { font-size: 16px; }
  p { margin: 0 0 10px; }
  a { color: var(--blue-2); }
  .muted { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }
  .s-ok { color: var(--ok); font-weight: 600; }
  .s-warn { color: var(--warn); font-weight: 600; }
  .s-bad { color: var(--bad); font-weight: 600; }

  /* Header and menu */
  .top { background: var(--blue); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px;
    border-bottom: 4px solid var(--accent); }
  .top .brand { flex: 1; font-weight: 700; font-size: 18px; line-height: 1.2; }
  .top .brand small { display: block; font-weight: 400; font-size: 13px; opacity: .85; }
  .top .who { font-size: 13px; text-align: right; opacity: .9; }
  nav.menu { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 12px; }
  nav.menu button { border: 0; background: none; padding: 14px 12px 11px; font: inherit; cursor: pointer; color: var(--ink);
    white-space: nowrap; border-bottom: 3px solid transparent; }
  nav.menu button:hover { color: var(--blue-2); }
  nav.menu button.on { font-weight: 700; color: var(--blue); border-bottom-color: var(--blue); }
  nav.menu .push { margin-left: auto; }
  nav.sub { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 18px; }
  nav.sub button { border: 0; background: none; padding: 4px 0; font: inherit; cursor: pointer; color: var(--blue-2);
    text-decoration: underline; }
  nav.sub button.on { color: var(--ink); font-weight: 700; text-decoration: none; }
  main { padding: 22px 20px 60px; max-width: 980px; margin: 0 auto; }

  /* Layout */
  .sec { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 22px; }
  .sec:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .box { border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 14px; background: #fff; }
  .grid { display: grid; gap: 4px 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.end { justify-content: flex-end; }
  .spacer { flex: 1; }

  /* Home: the numbered to-do list */
  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol.steps > li { counter-increment: step; position: relative; padding: 18px 0 18px 56px; border-top: 1px solid var(--line); }
  ol.steps > li:first-child { border-top: 0; }
  ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: 16px; width: 38px; height: 38px;
    border: 2px solid var(--blue); color: var(--blue); border-radius: 50%; font-weight: 700; font-size: 18px;
    display: flex; align-items: center; justify-content: center; }
  ol.steps > li.finished::before { background: var(--blue); color: #fff; }
  ol.steps h2 { margin-bottom: 4px; }
  ol.steps .row { margin-top: 8px; }

  /* Buttons */
  .btn { border: 1px solid #8c959f; background: #fff; color: var(--ink); border-radius: 4px; padding: 9px 16px;
    font: inherit; font-weight: 600; min-height: 44px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--blue-2); color: var(--blue-2); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-2); color: #fff; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.big { font-size: 20px; padding: 16px 20px; min-height: 64px; width: 100%; text-align: center; margin-bottom: 10px; }
  .btn.small { font-size: 14px; padding: 5px 10px; min-height: 34px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, nav button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
  canvas:focus-visible, summary:focus-visible { outline: 3px solid #e08a1e; outline-offset: 2px; }

  /* Forms */
  label.field { display: block; margin-bottom: 12px; font-weight: 600; font-size: 15px; }
  label.field span.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=search], select, textarea {
    width: 100%; font: inherit; padding: 10px 11px; border: 1px solid #8c959f; border-radius: 4px; background: #fff;
    min-height: 44px; margin-top: 4px; color: var(--ink); }
  textarea { min-height: 96px; }
  input[readonly] { background: var(--soft); }
  input.huge { font-size: 22px; min-height: 60px; }
  label.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; padding: 8px 0; cursor: pointer; }
  label.check input { width: 24px; height: 24px; flex: none; margin-top: 1px; }

  /* Tables */
  table.t { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
  table.t th { font-size: 14px; font-weight: 700; border-bottom: 2px solid var(--ink); }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover { background: var(--soft); }
  table.b th, table.b td { border: 1px solid #333; }
  .scroll { overflow-x: auto; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; word-break: break-word; }

  /* Messages */
  .banner { padding: 16px; font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 12px; border-radius: 4px; }
  .banner small { display: block; font-size: 16px; font-weight: 600; margin-top: 4px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); border: 2px solid var(--ok); }
  .banner.bad { background: var(--bad-bg); color: var(--bad); border: 2px solid var(--bad); }
  .note { border-left: 4px solid var(--blue-2); background: var(--soft); padding: 10px 12px; margin-bottom: 12px; }
  .note.warn { border-color: #c98a00; background: var(--warn-bg); }
  .note.bad { border-color: var(--bad); background: var(--bad-bg); }
  .note.ok { border-color: var(--ok); background: var(--ok-bg); }

  details { margin-top: 14px; }
  summary { cursor: pointer; font-weight: 700; color: var(--blue-2); padding: 6px 0; }
  details > div { padding: 8px 0 0; }

  .overlay { position: fixed; inset: 0; background: rgba(20, 28, 40, .55); display: flex; align-items: flex-start;
    justify-content: center; padding: 24px 10px; overflow-y: auto; z-index: 50; }
  .modal { background: #fff; border-radius: 6px; width: 100%; max-width: 620px; padding: 20px; }
  .modal.wide { max-width: 940px; }
  .modal > h2 { margin-bottom: 12px; }
  #busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: #e08a1e; z-index: 99; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 100; display: flex;
    flex-direction: column; gap: 8px; width: min(92vw, 520px); }
  #toast div { background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 4px; font-size: 15px; }
  #toast div.bad { background: var(--bad); }
  #toast div.ok { background: var(--ok); }

  .list-btn { display: flex; width: 100%; text-align: left; gap: 12px; align-items: baseline; border: 0;
    border-bottom: 1px solid var(--line); background: #fff; padding: 14px 6px; font: inherit; font-size: 18px; cursor: pointer; }
  .list-btn:hover { background: var(--soft); }

  /* Parent pages */
  body.parent main { max-width: 640px; }
  .school { text-align: center; padding: 16px 12px 12px; border-bottom: 4px solid var(--accent); }
  .school .name { font-size: 20px; font-weight: 800; color: var(--blue); }
  .school .addr { font-size: 13px; color: var(--muted); }
  .lang { display: flex; justify-content: center; gap: 0; margin: 10px 0 0; }
  .lang button { min-height: 40px; padding: 6px 18px; border: 1px solid var(--blue); background: #fff; color: var(--blue);
    font: inherit; font-weight: 600; cursor: pointer; }
  .lang button:first-child { border-radius: 4px 0 0 4px; }
  .lang button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .lang button.on { background: var(--blue); color: #fff; }
  .progress { display: flex; gap: 6px; margin: 0 0 6px; }
  .progress span { flex: 1; height: 6px; background: var(--line); }
  .progress span.on { background: var(--blue); }
  canvas.sig { width: 100%; height: 200px; border: 2px solid #57606a; border-radius: 4px; background: #fff;
    touch-action: none; display: block; }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; }
    .letter { page-break-after: always; padding: 30px 20px; text-align: center; font-size: 16px; }
    .letter:last-child { page-break-after: auto; }
    .letter svg { width: 260px; height: 260px; }
  }
  @media (max-width: 600px) {
    main { padding: 16px 14px 50px; }
    .top { padding: 10px 14px; }
    .top .who { display: none; }
    ol.steps > li { padding-left: 48px; }
    table.t { font-size: 14px; }
  }
</style>
